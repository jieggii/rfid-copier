; PlatformIO project configuration for rfid-copier
; https://docs.platformio.org/page/projectconf.html

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

; Serial console for the command interface.
monitor_speed = 115200
upload_speed = 57600

lib_deps =
    miguelbalboa/MFRC522@^1.4.11
